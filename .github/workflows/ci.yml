name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUDUDA_PLUGIN_DIR: ${{ github.workspace }}/plugin
    steps:
      - name: Check out runtime
        uses: actions/checkout@v4
        with:
          path: runtime
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          repository: Shaywww/YmaKmern-plugin
          path: plugin
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt
      - name: Install test dependencies
        working-directory: runtime
        run: python -m pip install -e ".[dev]" "AstrBot==4.26.8"
      - name: Compile
        working-directory: runtime
        run: python -m compileall -q packages/dududa-agent/src tests
      - name: Test
        working-directory: runtime
        run: python -m pytest -q -m "not net"
