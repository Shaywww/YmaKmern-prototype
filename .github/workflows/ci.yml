name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUDUDA_PLUGIN_DIR: ${{ github.workspace }}/plugin
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Check out runtime
        uses: actions/checkout@v7
        with:
          path: runtime
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          repository: Shaywww/YmaKmern-plugin
          path: plugin
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt
      - name: Install test dependencies
        working-directory: runtime
        run: python -m pip install -e ".[dev]" "AstrBot==4.26.8"
      - name: Compile
        working-directory: runtime
        run: python -m compileall -q packages/dududa-agent/src tests
      - name: Test
        id: pytest
        continue-on-error: true
        working-directory: runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m "not net" \
            --junitxml="$RUNNER_TEMP/pytest-report.xml" \
            2>&1 | tee "$RUNNER_TEMP/pytest-output.log"
      - name: Publish test summary
        if: always()
        working-directory: runtime
        shell: bash
        run: |
          {
            echo "## Pytest"
            echo
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/pytest-output.log" 2>/dev/null \
              || echo "pytest did not start"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce test result
        if: steps.pytest.outcome != 'success'
        run: exit 1
