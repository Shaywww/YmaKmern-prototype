[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dududa-agent"
version = "0.1.0"
description = "dududa 2.0 Agent Runtime prototype"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "pypinyin>=0.55.0",
    "uvicorn[standard]>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/dududa-agent/src"]
addopts = ["-v", "--tb=short", "-m", "not net"]
markers = [
    "net: real-network smoke（需要真实 API key，仅显式 -m net 运行）",
]

[tool.setuptools.packages.find]
where = ["packages/dududa-agent/src"]
include = ["dududa*"]
