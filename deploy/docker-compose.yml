version: "3.8"

services:
  dududa:
    build: ..
    container_name: dududa20
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DUDUDA_ENV=production
      - DUDUDA_DOMAIN=${DUDUDA_DOMAIN:-dududa.example.com}
    volumes:
      - dududa_data:/app/data
    networks:
      - dududa_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: dududa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - dududa
    networks:
      - dududa_net

  certbot:
    image: certbot/certbot
    container_name: dududa_certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  dududa_data:
  certbot_www:

networks:
  dududa_net:
    driver: bridge